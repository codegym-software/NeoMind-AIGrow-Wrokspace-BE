spring:
  profiles:
    active: dev
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ISSUER_URI:https://cognito-idp.ap-southeast-2.amazonaws.com/ap-southeast-2_TespiMS7C}
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:10MB}
      max-request-size: ${MAX_UPLOAD_SIZE:10MB}

server:
  port: ${PORT:8088}

cognito:
  issuer-uri: ${ISSUER_URI:https://cognito-idp.ap-southeast-2.amazonaws.com/ap-southeast-2_TespiMS7C}
  client-id: ${CLIENT_ID:1eg6hhsgee31ha8hh6lg2kjn9p}
  # Nếu app client của bạn có secret, thêm dòng dưới
  # client-secret: ${CLIENT_SECRET:<client_secret_trong_Cognito>}

app:
  cors:
    allowed-origins: ${FRONTEND_ORIGIN:http://localhost:3000}
  upload:
    base-url: ${PUBLIC_FILES_BASE_URL:http://localhost:8088/files}
    max-file-size: ${MAX_UPLOAD_SIZE:10MB}
  defaults:
    roleId: 201

file:
  storage:
    base-dir: ${FILE_STORAGE_BASE:/tmp/uploads}
    buckets:
      company-logo: company-logos
      user-avatar: user-avatars
      temp: temp

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true
