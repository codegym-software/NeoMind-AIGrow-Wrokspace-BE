spring:
  profiles:
    active: dev
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ISSUER_URI:https://cognito-idp.us-east-1.amazonaws.com/us-east-1_DT4Gid44g}

server:
  port: ${PORT:8088}

cognito:
  issuer-uri: ${ISSUER_URI:https://cognito-idp.us-east-1.amazonaws.com/us-east-1_DT4Gid44g}
  client-id: ${CLIENT_ID:4e4vnk6801iebpftjpu5kudp1d}

app:
  cors:
    allowed-origins: ${FRONTEND_ORIGIN:http://localhost:5173}

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true
