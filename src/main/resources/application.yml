server:
  port: ${SERVER_PORT:8088}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/neomind_db?useSSL=false&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:neomind}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQL8Dialect
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ISSUER_URI:https://example.com}
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:10MB}
      max-request-size: ${MAX_UPLOAD_SIZE:10MB}

cognito:
  issuer-uri: ${ISSUER_URI:https://example.com}
  client-id: ${CLIENT_ID:example-client}

app:
  cors:
    allowed-origins: ${FRONTEND_ORIGIN}

  upload:
    base-url: ${PUBLIC_FILES_BASE_URL}
    max-file-size: ${MAX_UPLOAD_SIZE}

file:
  storage:
    base-dir: ${FILE_STORAGE_BASE}
    buckets:
      company-logo: company-logos
      user-avatar: user-avatars
      temp: temp
