server:
  port: ${PORT}

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update # Hoặc validate, none, create-drop tùy môi trường
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ISSUER_URI}
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE}
      max-request-size: 5 MB

cognito:
  issuer-uri: ${ISSUER_URI}
  client-id: ${CLIENT_ID}
  userinfo-url: https://ap-southeast-2tespims7c.auth.ap-southeast-2.amazoncognito.com/oauth2/userInfo


app:
  cors:
    allowed-origins: ${FRONTEND_ORIGIN}

  upload:
    base-url: ${PUBLIC_FILES_BASE_URL}
    max-file-size: ${MAX_UPLOAD_SIZE}

file:
  storage:
    base-dir: ${FILE_STORAGE_BASE}
    buckets:
      company-logo: company-logos
      user-avatar: user-avatars
      temp: temp

logging:
  level:
    com.springboot.demo.security: DEBUG
    org.springframework.security.authorization: TRACE
    org.springframework.security.access: DEBUG
