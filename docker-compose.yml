services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: neomind_db
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: neomind
      MYSQL_PASSWORD: password
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql-conf.d/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8080
      # JDBC URL maps to service name 'db'
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/neomind_db?useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: neomind
      SPRING_DATASOURCE_PASSWORD: password
      # Optional overrides
      ISSUER_URI: https://example.com
      CLIENT_ID: example-client-id
      FRONTEND_ORIGIN: http://localhost:3000
      MAX_UPLOAD_SIZE: 10MB
      PORT: 8080
      PUBLIC_FILES_BASE_URL: http://localhost:8080/files
      FILE_STORAGE_BASE: /app/uploads
    ports:
      - "8080:8080"
    volumes:
      - ./ai-grow-uploads:/app/ai-grow-uploads

volumes:
  db_data:
